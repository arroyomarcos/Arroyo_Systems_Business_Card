<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Marcos Arroyo Navarro, Fundador de Arroyo Systems. Diseñamos. Calculamos. Fabricamos." />

    <title>Marcos Arroyo Navarro | Arroyo Systems</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marcos Arroyo Navarro | Arroyo Systems" />
    <meta property="og:description" content="Fundador de Arroyo Systems. Diseñamos. Calculamos. Fabricamos." />
    <meta property="og:site_name" content="Arroyo Systems" />
    <!-- Replace with the final GitHub Pages URL after publishing for richer WhatsApp and LinkedIn previews. -->
    <meta property="og:image" content="assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preload" href="assets/arroyo-systems-logo-v2.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-label="Digital business card">
            <section class="business-card" id="businessCard" aria-labelledby="personName">
        <header class="card-header">
          <img class="brand-logo" src="assets/arroyo-systems-logo-v2.png" alt="Arroyo Systems" />
        </header>

        <div class="identity">
          <p class="eyebrow" id="locationText"></p>
          <h1 id="personName"></h1>
          <p class="role" id="roleText"></p>
          <p class="tagline" id="taglineText"></p>
        </div>


        <ul class="details" aria-label="Datos de contacto">
          <li><span>Teléfono</span><a id="phoneLink"></a></li>
          <li><span>Email</span><a id="emailLink"></a></li>
          <li><span>Web</span><a id="websiteLink" target="_blank" rel="noopener noreferrer"></a></li>
          <li><span>LinkedIn</span><a id="linkedinLink" target="_blank" rel="noopener noreferrer"></a></li>
        </ul>

        <nav class="actions" aria-label="Acciones">
          <button class="action action-primary" id="saveContact" type="button">Guardar contacto</button>
        </nav>

        <button class="share-button" id="shareButton" type="button" aria-label="Compartir esta tarjeta digital" hidden>
          <span>Compartir tarjeta</span>
        </button>

      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
