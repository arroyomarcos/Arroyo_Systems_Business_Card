<!doctype html>
<html lang="es">
  <head>

    <title>Marcos Arroyo Navarro | Arroyo Systems</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marcos Arroyo Navarro | Arroyo Systems" />
    <meta property="og:description" content="Fundador de Arroyo Systems. Diseñamos. Calculamos. Fabricamos." />
    <meta property="og:site_name" content="Arroyo Systems" />
    <!-- Replace with the final GitHub Pages URL after publishing for richer WhatsApp and LinkedIn previews. -->
    <meta property="og:image" content="assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-label="Digital business card">
            <section class="business-card" id="businessCard" aria-labelledby="personName">
        <header class="card-header">
          <picture>
            <source srcset="assets/arroyo-systems-logo-dark.png" media="(prefers-color-scheme: dark)" />
            <img class="brand-logo" src="assets/arroyo-systems-logo-v2.png" alt="Arroyo Systems" />
          </picture>
        </header>

        <div class="identity">
          <p class="eyebrow" id="locationText">Madrid, Spain</p>
          <h1 id="personName">Marcos Arroyo Navarro</h1>
          <p class="role" id="roleText">Fundador</p>
          <p class="tagline" id="taglineText">Diseñamos. Calculamos. Fabricamos.</p>
        </div>


        <ul class="details" aria-label="Datos de contacto">
          <li><span>Teléfono</span><a id="phoneText" href="tel:+34691018974">+34 691 01 89 74</a></li>
          <li><span>Email</span><a id="emailText" href="mailto:contact@arroyo-systems.com">contact@arroyo-systems.com</a></li>
          <li><span>Web</span><a id="webText" href="https://www.arroyo-systems.com" target="_blank" rel="noopener noreferrer">arroyo-systems.com</a></li>
        </ul>

        <nav class="actions" aria-label="Contact actions">
          <a class="action action-primary" id="saveContact" href="assets/marcos-arroyo-navarro.vcf" download aria-label="Save Marcos Arroyo contact">
            <span>Guardar contacto</span>
          </a>

          <div class="quick-actions">
            <a class="action" id="phoneLink" href="tel:+34691018974" aria-label="Call Marcos Arroyo Navarro">
              <span>Llamar</span>
            </a>
            <a class="action" id="emailLink" href="mailto:contact@arroyo-systems.com" aria-label="Email Marcos Arroyo Navarro">
              <span>Email</span>
            </a>
            <a class="action" id="linkedinLink" href="https://www.linkedin.com/company/arroyo-systems-eng/" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn company page">
              <span>LinkedIn</span>
            </a>
            <a class="action" id="websiteLink" href="https://www.arroyo-systems.com" target="_blank" rel="noopener noreferrer" aria-label="Visit Arroyo Systems website">
              <span>Web</span>
            </a>
          </div>
        </nav>

        <button class="share-button" id="shareButton" type="button" aria-label="Share this digital card" hidden>
          <span>Compartir tarjeta</span>
        </button>

      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
